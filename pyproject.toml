[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codedna"
version = "0.1.0"
description = "Code DNA: a hybrid NoSQL framework for software repository analysis and similarity detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo>=4.6",
    "neo4j>=5.14",
    "redis>=5.0",
    "cassandra-driver>=3.29",
    # Python 3.12+ removed asyncore; the driver needs it when its libev C extension is absent (Windows)
    "pyasyncore>=1.0.2; python_version >= '3.12'",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "requests>=2.31",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "radon>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mongomock>=4.1",
]
semantic = [
    # optional: neural embeddings to replace the hashed bag-of-words semantic vector
    "sentence-transformers>=2.5",
    "faiss-cpu>=1.8",
]

[project.scripts]
codedna = "codedna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
