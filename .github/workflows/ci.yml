name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (in-memory backends)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: git config --global user.email "ci@example.com" && git config --global user.name "ci"
      - run: pytest

  integration:
    name: contract tests against the real databases
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/codedna_pass
        ports: ["7687:7687"]
      cassandra:
        image: cassandra:4.1
        ports: ["9042:9042"]
        env:
          MAX_HEAP_SIZE: 512M
          HEAP_NEWSIZE: 128M
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 15s --health-timeout 10s --health-retries 20 --health-start-period 40s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: git config --global user.email "ci@example.com" && git config --global user.name "ci"
      - name: wait for Neo4j
        run: |
          for i in $(seq 1 40); do
            python -c "from neo4j import GraphDatabase; GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','codedna_pass')).verify_connectivity()" && exit 0
            sleep 3
          done
          exit 1
      - run: pytest tests/test_storage_contract.py
        env:
          CODEDNA_TEST_REAL: "1"